<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#db2777" />
    <title>Sem conexão | Conecta Eleitor</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        color: #475569;
        background: linear-gradient(135deg, #fff0f7, #ffffff 50%, #fdf2f8);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      main {
        width: 100%;
        max-width: 32rem;
        padding: 2.5rem;
        text-align: center;
        background: #ffffff;
        border: 1px solid #ffe1ef;
        border-radius: 1rem;
        box-shadow: 0 4px 24px -4px rgba(219, 39, 119, 0.3);
      }

      .status {
        width: 4rem;
        height: 4rem;
        margin: 0 auto;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-size: 1.875rem;
        border-radius: 1rem;
        background: linear-gradient(135deg, #db2777, #ec4899);
      }

      h1 {
        margin: 1.5rem 0 0;
        color: #831843;
        font-size: clamp(1.5rem, 5vw, 1.875rem);
      }

      p {
        margin: 0.75rem 0 0;
        line-height: 1.6;
      }

      button {
        min-height: 2.75rem;
        margin-top: 2rem;
        padding: 0.75rem 1.5rem;
        color: #ffffff;
        background: #db2777;
        border: 0;
        border-radius: 0.75rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #be185d;
      }

      button:focus-visible {
        outline: 2px solid #ec4899;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status" aria-hidden="true">!</div>
      <h1>Você está sem conexão</h1>
      <p>
        Verifique sua internet e tente novamente. Algumas informações do Conecta
        Eleitor precisam de conexão para serem atualizadas.
      </p>
      <button type="button" onclick="window.location.reload()">
        Tentar novamente
      </button>
    </main>
  </body>
</html>
